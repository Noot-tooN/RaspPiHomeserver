name: NixOS ARM64
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nixos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Verify expensive packages are cached
        run: python3 scripts/check_cache.py
      - name: Evaluate configuration and test applications
        run: nix flake check --print-build-logs
      - name: Test cache and update safeguards
        run: |
          python3 -m unittest discover -s tests -p 'test_automation*.py' -v
          node --test tests/test_auto_merge.cjs
      - name: Build the system
        run: nix build .#system --out-link result-system --print-build-logs
      - name: Publish and verify the signed application cache
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: python3 scripts/publish_cache.py
